[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge"
version = "0.1.0"
description = "AI-assisted engineering platform"
readme = "README.md"
requires-python = ">=3.13"

authors = [
    { name = "Kenjiro" }
]
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[project.scripts]
forge = "forge.cli.main:app"